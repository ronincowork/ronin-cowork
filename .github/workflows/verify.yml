name: verify

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Before anything is installed or built: the marks of a rewritten commit
      # (scripts/check-tamper.mjs). It reads the files and runs none of them.
      - run: node scripts/check-tamper.mjs
      - run: npm ci
      # Each test boots a real Ronin on a private tmux server (tests/helpers/ronin.ts):
      # a runner is the fresh box a new user has, so it must carry the binary.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - run: npm run verify
