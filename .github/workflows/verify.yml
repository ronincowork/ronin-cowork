# CI tier 1 — the byoin_checks, on every pull request, every push to dev or master,
# and by hand (workflow_dispatch).
#
# WHY dev PUSHES TOO (owner, 2026-08-22, after PR #26): agents integrate continuously
# on dev, but CI used to look only at the PR — so between PRs, a red dev was invisible
# to everyone, and the first anyone heard of it was seven failing runs on the next PR.
# A check that only speaks during review is working against the arrangement it guards.
#
# WHY --gates: it is the explicit fast repository tier. It does not launch smoke-ui or
# visual-ui and names both as SKIPs WITH THEIR REASON. UI-affecting work must carry a
# separate local `bin/ronin-byoin --ui` verdict until tier 2 below exists.
#
# Tier 2 — a real render check on a runner (tmux + Playwright + a started server + a
# seeded session) — is a separate, later piece of work. Not this file.
name: verify

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, dev]
  workflow_dispatch:

jobs:
  byoin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # NO `apt-get install tmux` HERE, and it is not an oversight (removed 2026-08-19).
      # The step existed on the claim that "several checks shell out to tmux". Measured:
      # sixteen of the seventeen gates never touch it, and the seventeenth — smoke-ui —
      # resolves Playwright FIRST and SKIPs before it would ever reach for a tmux session.
      # A runner has no browser, so on a runner that skip is certain and tmux is never
      # used at all. bin/ronin-build does not use it either.
      # It was not free. `apt-get update` hangs whenever Azure's Ubuntu mirrors are
      # unreachable — 22m52s on 2026-08-19, against 8 SECONDS for all seventeen gates —
      # so the install was the slowest and least reliable thing in the job, on every run,
      # for nothing. If a runner ever does drive a real render check (tier 2, above), it
      # brings its own tmux back with it, next to the browser it will also need.
      - run: npm ci
      - name: BYOIN — every check, then one verdict
        run: bin/ronin-byoin --gates
