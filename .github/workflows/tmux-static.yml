# TMUX-STATIC — builds the release's own tmux from pinned sources, then proves it
# on a box with nothing: busybox has no libc the binary could borrow, no terminfo
# database, no package manager. If the proof passes there, it passes on any box the
# installer will ever meet.
#
# This runs when the recipe changes (push) or on demand (dispatch) — a few times a
# year, when we bump tmux — NOT at release time. release.yml never compiles anything:
# it downloads the binary this workflow published, pinned by checksum in vendor.lock.
#
# Publishing is a separate deliberate act: dispatch with a release_tag (or create the
# tmux-static-vN release by hand from the run's artifact). Plain pushes only build
# and prove.
name: tmux-static

on:
  push:
    paths:
      - 'scripts/tmux-static/**'
      - '.github/workflows/tmux-static.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'publish as this release (e.g. tmux-static-v1); empty = build only'
        required: false
        default: ''

permissions:
  contents: write   # only used when release_tag is given

jobs:
  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build in Alpine (musl — actually static, not glibc-static)
        run: docker run --rm -v "$PWD:/src" -w /src alpine:3.22 sh scripts/tmux-static/build.sh linux-x64
      - name: prove it on a box with nothing
        run: |
          set -x
          file out/tmux-linux-x64
          file out/tmux-linux-x64 | grep -q 'statically linked'
          # busybox: no glibc, no musl, no terminfo. -V proves it loads;
          # the session round-trip proves the compiled-in terminfo fallbacks answer.
          docker run --rm -v "$PWD/out:/o" busybox /o/tmux-linux-x64 -V
          docker run --rm -v "$PWD/out:/o" -e TERM=xterm-256color busybox sh -c '
            mkdir -p /tmp &&
            /o/tmux-linux-x64 -S /tmp/s new-session -d &&
            /o/tmux-linux-x64 -S /tmp/s send-keys "echo proof-$$" Enter &&
            sleep 1 &&
            /o/tmux-linux-x64 -S /tmp/s capture-pane -p &&
            /o/tmux-linux-x64 -S /tmp/s kill-server' | grep -q '^proof-'
      - uses: actions/upload-artifact@v4
        with:
          name: tmux-static-linux-x64
          path: out/
      - name: publish (dispatch with release_tag only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.release_tag }}" out/tmux-linux-x64 out/tmux-linux-x64.sha256 \
            --title "${{ inputs.release_tag }}" \
            --notes "Static tmux, built by tmux-static.yml from the pins in scripts/tmux-static/build.sh. Not a Ronin release — release.yml consumes these, pinned in vendor.lock." \
            || gh release upload "${{ inputs.release_tag }}" out/tmux-linux-x64 out/tmux-linux-x64.sha256 --clobber
