# THE RELEASE — a tag becomes the ronin_artifact, built once for every box.
#
# Pushing a tag vX.Y.Z runs the byoin_checks (--gates: the render check SKIPs with its
# reason — a runner has no live server or browser), builds the tarballs with
# bin/ronin-build — the plain one plus a bundle per vendor.lock platform, each
# carrying its own Node, static tmux, and node_modules — and attaches them to a
# GitHub Release together with their checksums. Nothing compiles here: the static
# tmux comes pre-proven from a tmux-static-vN release (tmux-static.yml).
#
# Cutting a release is therefore two deliberate acts by a person, never automation:
# merging to master does NOT release, and a release does NOT update any box — a box
# moves only when bin/ronin-update (or the ⚙ gear) is run on it. docs/release.md is
# the whole procedure.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # gh release create needs to write the Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The release gate below must be able to prove that this tag belongs to master.
          fetch-depth: 0
      - name: Refuse a tag cut from outside master
        run: |
          tag_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/master; then
            echo "::error::${GITHUB_REF_NAME} points to $tag_commit, which is not on master."
            echo "Fetch and check out master before creating a release tag."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # NO `apt-get install tmux` HERE, and it is not an oversight (removed 2026-08-19).
      # The step existed on the claim that "several checks shell out to tmux". Measured:
      # sixteen of the seventeen gates never touch it, and the seventeenth — smoke-ui —
      # resolves Playwright FIRST and SKIPs before it would ever reach for a tmux session.
      # A runner has no browser, so on a runner that skip is certain and tmux is never
      # used at all. bin/ronin-build does not use it either.
      # It was not free. `apt-get update` hangs whenever Azure's Ubuntu mirrors are
      # unreachable — 22m52s on 2026-08-19, against 8 SECONDS for all seventeen gates —
      # so the install was the slowest and least reliable thing in the job, on every run,
      # for nothing. If a runner ever does drive a real render check (tier 2, above), it
      # brings its own tmux back with it, next to the browser it will also need.
      - run: npm ci
      - name: BYOIN — no unchecked bytes get published
        run: bin/ronin-byoin --gates
      - name: build the artifacts
        env:
          GH_TOKEN: ${{ github.token }}   # gh downloads the pinned tmux-static asset
        run: bin/ronin-build "$GITHUB_REF_NAME"
      - name: publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/ronin-cowork-"$GITHUB_REF_NAME"*.tar.gz \
            release/SHA256SUMS \
            --verify-tag --generate-notes
