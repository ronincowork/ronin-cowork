    <link rel="apple-touch-icon" href="/brand/nin-mark-256.png" />
    <script>
      try {
        var t = localStorage.getItem('tmuxgrid.theme');
        if (t !== 'light' && t !== 'dark') {
          t = localStorage.getItem('tmuxgrid.theme.system.mobile') || 'light';
        }
        if (t === 'light') document.documentElement.dataset.theme = 'light';
      } catch (e) {}
    </script>
    <!-- THE MOBILE DOCUMENT. A phone downloads this page and nothing else: no desktop bar,
         no workbench, no boot skeleton. The first frame the browser paints is the bar
         below, because there is nothing else in the document to paint; js/phone.js fills
         the list and routes the screens. The server sends this at /m, and at / to a phone.
         The document reads its own address before that first frame: at the front door the
         bar opens with the mark and "Teams"; inside a Team or on a tile it opens with ‹, so
         the screen the address names is the first one painted, never the Teams bar first. -->
    <script>
      try {
        if (/^#\/(?:m\/)?(?:t|d|s|team|feedback)(?:\/|$)/.test(location.hash)) document.documentElement.dataset.screen = 'inside';
      } catch (e) {}
    </script>
