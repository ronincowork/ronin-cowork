<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Ronin</title>
    <!-- THE HOUSE MARK. Copied from ronin-lab, which owns it — public/brand/README.md says
         where and why. SVG first so a retina tab and a bookmark bar stay sharp at any size;
         the 32px PNG is the fallback for anything that will not take one. The 256 is what
         iOS puts on a home screen, which is the arrival REMOTE_ACCESS is built around. -->
    <link rel="icon" type="image/svg+xml" href="/brand/nin-mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/nin-mark-32.png" />
    <link rel="apple-touch-icon" href="/brand/nin-mark-256.png" />
    <!-- The saved theme, applied BEFORE the stylesheet paints — a light-theme reload
         must not flash dark. Inline and tiny on purpose; js/theme.js owns the rest. -->
    <script>
      try {
        var t = localStorage.getItem('tmuxgrid.theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        if (t === 'light') document.documentElement.dataset.theme = 'light';
      } catch (e) {}
    </script>
    <!-- xterm.css rides inside style.css now (@import into the lowest cascade layer,
         still the absolute /vendor path shared by live and staging) so every app rule
         outranks vendor rules by layer order rather than by accident of load order. -->
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="css/league.css" />
    <link rel="stylesheet" href="css/team-workspace.css" />
    <link rel="stylesheet" href="css/new-team.css" />
    <link rel="stylesheet" href="css/agent-configuration.css" />
  </head>
  <body>
    <header id="bar">
      <button id="brandbtn" class="brand" data-t-title="bar.brand_title" title="⛩ ronin — the session roster">⛩ ronin</button>
      <a id="leaguebtn" class="brand" href="#/league" target="_blank" rel="noopener noreferrer"
         data-t-title="bar.league_title" title="Open League in a new browser tab" data-t="bar.league">League</a>
      <button id="servicesstate" class="services-state" type="button" hidden aria-expanded="false"></button>
      <!-- ＋ opens a SECOND RONIN in a new browser tab. The owner already worked this way by
           opening tabs by hand; the button exists so everyone else discovers it is possible,
           which was his reason: "if it could launch another tab, that would make it easier so
           that people know that this is actually possible." Beside the brand, deliberately not
           among the five verbs on the right — those share one measured width and this is not
           one of them. -->
      <button id="newtabbtn" class="newtab" data-t-title="bar.newtab_title" title="Open a second Ronin in a new browser tab">＋</button>
      <!-- RAM_RPM — the box's working reading. A tachometer: always there, mostly
           ignored, so you learn what normal looks like without being told. It sits with
           the brand and NOT among the five verbs on the right, which share one measured
           width and are all things you press; this is a readout and does nothing when
           clicked. js/ramrpm.js writes the face and the title. -->
      <span id="ramrpm" class="ramrpm" hidden></span>
      <span class="grow"></span>
      <!-- THE LAYOUT MAP — the workspace drawn small: one rectangle per column, click
           to show or hide, drag to reorder. Empty unless the active view has columns
           to arrange (the Team workbench does; Sessions and League do not). The
           ViewHost (js/workspace.js) fills it; no feature writes here. It sits in the
           grow gap, left of the five verbs, which keep their measured width. -->
      <!-- THE TAB'S NAME — a field the owner can type over, because three tabs each titled
           "team · Ronin" cannot be told apart (owner, 2026-08-26). Empty unless the active
           view offers a name to edit (the Team page does; its default is the team). The
           ViewHost fills it; what is typed becomes the browser tab's title, per tab. -->
      <span id="viewname" class="wk-view-name"></span>
      <span id="viewmap" class="wk-view-map"></span>
      <button id="newbtn" data-t-title="bar.new_title" title="⌃⇧N — start a new session: pick what it is for, where it works and who it is">か<span class="txt" data-t="bar.new"> New</span></button>
      <!-- ⛩ is the house mark for "open the Commons", and this is the door: ONE press
           lands on ⌂ Roster, the first port of call once you are in there. It dropped a
           registry-fed menu of every room until 2026-08-17; the owner ruled the menu out
           (a list of nine rooms in front of the one you wanted every time) and took the
           known cost with his eyes open — the bar no longer reaches a SPECIFIC room in
           one press. The tab strip inside the Commons is where you pick a room now. -->
      <button id="commonsbtn" data-t-title="bar.commons_title" title="⌃⇧C — the CoWorking Commons, straight to ⌂ Roster. The tab strip inside it reaches the other rooms. (⌃⌥C on Linux/Windows.)">⛩<span class="txt" data-t="bar.commons"> Commons</span></button>
      <button id="padbtn" data-t-title="bar.keypad_title" title="Keypad — the Work Louder pad: physical keys fire macros">く<span class="txt" data-t="bar.keypad"> Keypad</span></button>
      <button id="mikabtn" data-t-title="bar.mika_title" title="Mika Assist — ask about Ronin itself: how it works, project roots, starting a session, changing a setting. Starts her if she is not up.">ミ<span class="txt" data-t="bar.mika"> Mika Assist</span></button>
      <!-- ⚙ ADMIN DESK — the machine, not a session. It was a page-level sheet under the
           2026-08-16 ruling that install-level facts must not be copied into every tile;
           since 2026-08-18 it opens the admin_desk, which is a TILE and so keeps that
           singleness (drawn where you press ⚙, not in all four) while getting back the
           full pane a sheet could not give. ADMIN, not INSTALL: half of what it holds —
           logging out, appearance — is not about the box (owner, 2026-08-18).
           The label is 75px in the shipped font, the same as ミ Mika Assist, so it sits
           inside the five verbs' measured 100px box without moving it (see style.css). -->
      <button id="sysbtn" data-t-title="bar.desk_title" title="Admin Desk — this machine and this app: configuration, project roots, hotwords, Koshi, gbrain, stats, appearance, updates, log out">⚙<span class="txt" data-t="bar.desk"> Admin Desk</span></button>
      <div class="ctrls" role="group" data-t-aria="bar.keys" aria-label="Keys">
        <button id="k-esc" data-t-title="keys.esc" title="Esc" data-t="keys.esc">Esc</button>
        <button id="k-int" data-t-title="keys.interrupt_title" title="Ctrl-C (interrupt)">^C</button>
        <button id="k-bottom" data-t-title="keys.latest_title" title="Jump to latest output">⤓</button>
        <button id="k-more" data-t-title="keys.more" title="More keys" aria-expanded="false">⋯</button>
      </div>
      <!-- The grid count: ONE button wearing the number it is on, tapped to cycle
           1 → 2 → 4 → 1. It was a segmented trio, which spent three boxes saying what
           one says and left two of them permanently dark. js/viewport.js writes the
           face; the same node is relocated into the touch bar by js/layout.js. -->
      <button id="layoutcycle" class="layout-cycle" data-t-title="bar.layout_default_title" title="Four terminals — click for 1">4</button>
    </header>
    <div id="keypad" role="group" data-t-aria="keys.more" aria-label="More keys">
      <button data-key="cr" data-t-title="keys.enter" title="Enter">↵</button>
      <button data-key="tab" data-t-title="keys.tab" title="Tab" data-t="keys.tab">Tab</button>
      <button data-key="stab" data-t-title="keys.shift_tab" title="Shift-Tab" data-t="keys.shift_tab_face">⇧Tab</button>
      <button data-key="up" data-t-title="keys.up" title="Up">↑</button>
      <button data-key="down" data-t-title="keys.down" title="Down">↓</button>
      <button data-key="left" data-t-title="keys.left" title="Left">←</button>
      <button data-key="right" data-t-title="keys.right" title="Right">→</button>
    </div>
    <div id="viewhost">
      <main id="grid" class="layout-4" data-layout="4"></main>
      <section id="new-team-view" hidden></section>
      <section id="agent-config-view" hidden></section>
    </div>

    <!-- /vendor stays absolute: served from node_modules, shared by live and staging.
         Everything else is RELATIVE so this exact file also works under /staging/. -->
    <script src="/vendor/xterm.js"></script>
    <script src="/vendor/addon-fit.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
