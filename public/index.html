<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>tmux ronin</title>
    <!-- The saved theme, applied BEFORE the stylesheet paints — a light-theme reload
         must not flash dark. Inline and tiny on purpose; js/theme.js owns the rest. -->
    <script>
      try {
        var t = localStorage.getItem('tmuxgrid.theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        if (t === 'light') document.documentElement.dataset.theme = 'light';
      } catch (e) {}
    </script>
    <!-- xterm.css rides inside style.css now (@import into the lowest cascade layer,
         still the absolute /vendor path shared by live and staging) so every app rule
         outranks vendor rules by layer order rather than by accident of load order. -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="bar">
      <button id="brandbtn" class="brand" title="⛩ ronin — the session roster">⛩ ronin</button>
      <span class="grow"></span>
      <button id="newbtn" title="⌃⇧N — start a new session: pick what it is for, where it works and who it is">か<span class="txt"> New</span></button>
      <!-- ⛩ is the house mark for "open the Commons", and this is the door: ONE press
           lands on ⌂ Roster, the first port of call once you are in there. It dropped a
           registry-fed menu of every room until 2026-08-17; the owner ruled the menu out
           (a list of nine rooms in front of the one you wanted every time) and took the
           known cost with his eyes open — the bar no longer reaches a SPECIFIC room in
           one press. The tab strip inside the Commons is where you pick a room now. -->
      <button id="commonsbtn" title="⌃⇧C — the CoWorking Commons, straight to ⌂ Roster. The tab strip inside it reaches the other rooms. (⌃⌥C on Linux/Windows.)">⛩<span class="txt"> Commons</span></button>
      <button id="padbtn" title="Keypad — the Work Louder pad: physical keys fire macros">く<span class="txt"> Keypad</span></button>
      <button id="mikabtn" title="Mika Assist — ask about Ronin itself: how it works, project roots, starting a session, changing a setting. Starts her if she is not up.">ミ<span class="txt"> Mika Assist</span></button>
      <!-- ⚙ is install-level, so it lives at page level: ONE gear in the bar opening one
           sheet, never a room duplicated into every tile's Commons (owner, 2026-08-16).
           A STAGING POST, NOT THE FINAL SHAPE (2026-08-17): the owner wants this to read
           Account and eventually to open an Accounts tab in the Commons, backed by SETTEI.
           Only the LABEL moved today — the button still opens the same system.js sheet —
           because the fields an Accounts room would hold (owner name, entitlement) are
           exactly what SETTEI has not settled yet, and a room with nothing in it is four
           empty copies of the ruling above. Build the room when SETTEI lands. -->
      <button id="sysbtn" title="Account — this install and the way in: appearance, check for updates, passkey, log out">⚙<span class="txt"> Account</span></button>
      <div class="ctrls" role="group" aria-label="Keys">
        <button id="k-esc" title="Esc">Esc</button>
        <button id="k-int" title="Ctrl-C (interrupt)">^C</button>
        <button id="k-bottom" title="Jump to latest output">⤓</button>
        <button id="k-more" title="More keys" aria-expanded="false">⋯</button>
      </div>
      <!-- The grid count: ONE button wearing the number it is on, tapped to cycle
           1 → 2 → 4 → 1. It was a segmented trio, which spent three boxes saying what
           one says and left two of them permanently dark. js/viewport.js writes the
           face; the same node is relocated into the touch bar by js/layout.js. -->
      <button id="layoutcycle" class="layout-cycle" title="Four terminals — click for 1">4</button>
    </header>
    <div id="keypad" role="group" aria-label="More keys">
      <button data-key="cr" title="Enter">↵</button>
      <button data-key="tab" title="Tab">Tab</button>
      <button data-key="stab" title="Shift-Tab">⇧Tab</button>
      <button data-key="up" title="Up">↑</button>
      <button data-key="down" title="Down">↓</button>
      <button data-key="left" title="Left">←</button>
      <button data-key="right" title="Right">→</button>
    </div>
    <main id="grid" class="layout-4" data-layout="4"></main>

    <!-- /vendor stays absolute: served from node_modules, shared by live and staging.
         Everything else is RELATIVE so this exact file also works under /staging/. -->
    <script src="/vendor/xterm.js"></script>
    <script src="/vendor/addon-fit.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
