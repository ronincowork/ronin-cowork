<!doctype html>
<html lang="en" class="boot-pending">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Ronin</title>
    <link id="tabicon" rel="icon" type="image/svg+xml" href="/brand/nin-mark.svg" />
    <link rel="apple-touch-icon" href="/brand/nin-mark-256.png" />
    <script>
      try {
        var t = localStorage.getItem('tmuxgrid.theme');
        if (t !== 'light' && t !== 'dark') {
          var coarse = matchMedia('(pointer: coarse)').matches;
          t = localStorage.getItem(coarse ? 'tmuxgrid.theme.system.mobile' : 'tmuxgrid.theme.system') || 'light';
        }
        if (t === 'light') document.documentElement.dataset.theme = 'light';
      } catch (e) {}
    </script>
    <style>:root.boot-pending body { visibility: hidden; }</style>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="css/team-workspace.css" />
    <link rel="stylesheet" href="css/launch-forms.css" />
    <link rel="stylesheet" href="css/campaign-home.css" />
    <link rel="stylesheet" href="css/feedback.css" />
  </head>
  <body>
    <header id="bar">
      <a id="brandbtn" class="brand brand-home ui-bar-nav" href="./" aria-label="Ronin">
        <img class="brand-mark" src="brand/nin-mark.svg" alt="" />
        <span class="brand-word">RoninCowork</span>
      </a>
      <span id="coworkssep" class="ui-bar-separator" aria-hidden="true" hidden>•</span>
      <a id="coworksbtn" class="ui-bar-nav" href="#/cowork" hidden>Coworks</a>
      <button id="servicesstate" class="services-state" type="button" hidden aria-expanded="false"></button>
      <span class="grow"><span id="viewplace" class="ui-bar-place" hidden></span></span>
      <span id="viewname" class="wk-view-name"></span>
      <span id="viewmap" class="wk-view-map"></span>
      <span id="ramrpm" class="ramrpm" hidden></span>
      <span id="feedbackaction"></span>
      <button id="shapecycle" class="shape-cycle" hidden data-t-title="bar.shape_title" title="Two workspaces — click for four">2</button>
      </header>
    <div id="viewhost">
      <section id="cowork-view" class="cc-view" hidden></section>
    </div>

    <script src="/vendor/xterm.js"></script>
    <script src="/vendor/addon-fit.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
