<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Ronin</title>
    <!-- THE HOUSE MARK. Copied from ronin-lab, which owns it — public/brand/README.md says
         where and why. SVG first so a retina tab and a bookmark bar stay sharp at any size;
         the 32px PNG is the fallback for anything that will not take one. The 256 is what
         iOS puts on a home screen, which is the arrival REMOTE_ACCESS is built around. -->
    <link id="tabicon" rel="icon" type="image/svg+xml" href="/brand/nin-mark.svg" />
    <link rel="apple-touch-icon" href="/brand/nin-mark-256.png" />
    <!-- The saved theme, applied BEFORE the stylesheet paints — a light-theme reload
         must not flash dark. Inline and tiny on purpose; js/theme.js owns the rest. -->
    <script>
      try {
        var t = localStorage.getItem('tmuxgrid.theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        if (t === 'light') document.documentElement.dataset.theme = 'light';
      } catch (e) {}
    </script>
    <!-- xterm.css rides inside style.css now (@import into the lowest cascade layer,
         still the absolute /vendor path shared by live and staging) so every app rule
         outranks vendor rules by layer order rather than by accident of load order. -->
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="css/team-workspace.css" />
    <link rel="stylesheet" href="css/new-team.css" />
    <link rel="stylesheet" href="css/campaign-home.css" />
  </head>
  <body>
    <header id="bar">
      <button id="brandbtn" class="brand brand-home" aria-label="Ronin">⛩ ronin</button>
      <span id="campaignvalue" class="bar-context" hidden></span>
      <button id="coworksbtn" class="bar-nav" type="button" hidden>Coworks</button>
      <span id="teamvalue" class="bar-context" hidden></span>
      <button id="servicesstate" class="services-state" type="button" hidden aria-expanded="false"></button>
      <span class="grow"></span>
      <!-- THE LAYOUT MAP — the workspace drawn small: one rectangle per column, click
           to show or hide, drag to reorder. Empty unless the active view has columns
           to arrange (the Team workbench does; Sessions and League do not). The
           ViewHost (js/workspace.js) fills it; no feature writes here. It sits in the
           grow gap, left of the five verbs, which keep their measured width. -->
      <!-- THE TAB'S NAME — a field the owner can type over, because three tabs each titled
           "team · Ronin" cannot be told apart (owner, 2026-08-26). Empty unless the active
           view offers a name to edit (the Team page does; its default is the team). The
           ViewHost fills it; what is typed becomes the browser tab's title, per tab. -->
      <span id="viewname" class="wk-view-name"></span>
      <span id="viewmap" class="wk-view-map"></span>
      <!-- RAM_RPM — the box's working reading. A tachometer: always there, mostly
           ignored, so you learn what normal looks like without being told. On the RIGHT,
           with the readouts and verbs — the left of the bar is navigation only (owner,
           2026-08-29); it stays outside the verbs' measured width because it is a readout
           and does nothing when clicked. js/ramrpm.js writes the face and the title. -->
      <span id="ramrpm" class="ramrpm" hidden></span>
      <!-- THE BAR IS ONE VERB (owner, 2026-08-27): ⚙ Admin Desk — the cowork commons. か New
           went the way of ⛩ Commons, ミ Mika Assist and く Keypad: a new session is a
           workspace surface (＋ Add team member on the roster, ⌃⇧N), the Commons is the
           tile's own ⛩ on the parked grid page, Mika is the `mika` tool, Keypad a tab. The
           1·2·4 count is gone too — the cowork_space's shape is the roster's 2 | 4; the
           parked grid page still cycles from the pad's ▚ key and ⌃⇧1/2/4. -->
      <!-- THE SHAPE — 2 ⇄ 4 (owner, 2026-08-28): one button wearing the count the cowork_space
           is on, clicked to alternate, in the seat the 1·2·4 count had. js/team-view.js
           writes its face and owns the click; hidden when no cowork_space is showing. -->
      <button id="shapecycle" class="shape-cycle" hidden data-t-title="bar.shape_title" title="Two workspaces — click for four">2</button>
      <button id="sysbtn" data-t-title="bar.desk_title" title="Admin Desk — this machine and this app: configuration, project roots, hotwords, Koshi, gbrain, stats, appearance, updates, log out">⚙<span class="txt" data-t="bar.desk"> Admin Desk</span></button>
      <div class="ctrls" role="group" data-t-aria="bar.keys" aria-label="Keys">
        <button id="k-esc" data-t-title="keys.esc" title="Esc" data-t="keys.esc">Esc</button>
        <button id="k-int" data-t-title="keys.interrupt_title" title="Ctrl-C (interrupt)">^C</button>
        <button id="k-bottom" data-t-title="keys.latest_title" title="Jump to latest output">⤓</button>
        <button id="k-more" data-t-title="keys.more" title="More keys" aria-expanded="false">⋯</button>
      </div>
      <!-- The grid count: ONE button wearing the number it is on, tapped to cycle
           1 → 2 → 4 → 1. It was a segmented trio, which spent three boxes saying what
           one says and left two of them permanently dark. js/viewport.js writes the
           face; the same node is relocated into the touch bar by js/layout.js. -->
    </header>
    <div id="keypad" role="group" data-t-aria="keys.more" aria-label="More keys">
      <button data-key="cr" data-t-title="keys.enter" title="Enter">↵</button>
      <button data-key="tab" data-t-title="keys.tab" title="Tab" data-t="keys.tab">Tab</button>
      <button data-key="stab" data-t-title="keys.shift_tab" title="Shift-Tab" data-t="keys.shift_tab_face">⇧Tab</button>
      <button data-key="up" data-t-title="keys.up" title="Up">↑</button>
      <button data-key="down" data-t-title="keys.down" title="Down">↓</button>
      <button data-key="left" data-t-title="keys.left" title="Left">←</button>
      <button data-key="right" data-t-title="keys.right" title="Right">→</button>
    </div>
    <div id="viewhost">
      <section id="cowork-view" class="cc-view" hidden></section>
    </div>

    <!-- /vendor stays absolute: served from node_modules, shared by live and staging.
         Everything else is RELATIVE so this exact file also works under /staging/. -->
    <script src="/vendor/xterm.js"></script>
    <script src="/vendor/addon-fit.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
