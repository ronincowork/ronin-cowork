# tmux config used ONLY to start the long-lived server (see tmux-server.service).
# It is not a replacement for your ~/.tmux.conf — it loads it, then adds the one
# setting the server unit depends on.

source-file -q ~/.tmux.conf

# Keep the server alive with zero sessions. Without this, tmux exits as soon as the
# last session ends — and the NEXT session is then started by whoever asks for one
# first (usually ronin), which puts the new server back inside that process's
# systemd cgroup, where `systemctl --user restart ronin` kills it. An always-on
# empty server is what keeps session ownership out of the app's hands.
set-option -s exit-empty off

# SCROLLING IN A TILE IS TMUX COPY-MODE, AND NOTHING ELSE OF COPY-MODE IS WANTED THERE
# (owner, 2026-09-02). A wheel over a browser tile enters copy-mode to scroll the pane's
# history — that is the scroll, and it stays. But copy-mode then read every keystroke as
# a command: f/t/F/T opened "(jump forward)" and "(jump to ...)" prompts that ate the next
# character, g opened "(goto line)", n/N/;/, repeated searches and jumps, and the [n/m]
# counter sat in the corner. The owner: "it's like the scroll mode wants to jump to
# different sections." So: the wheel enters copy-mode with the position indicator hidden
# (-H) and still leaves at the bottom (-e); and every jump / search / goto / repeat key is
# unbound in both copy-mode tables, so typing while scrolled up does nothing until you are
# back at the bottom or press Escape. Scroll, page and arrow keys are untouched. Tried live
# on the running server first; the owner confirmed scrolling and no counter.
bind-key -T root WheelUpPane if-shell -F "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -eH"
unbind-key -T copy-mode f
unbind-key -T copy-mode t
unbind-key -T copy-mode F
unbind-key -T copy-mode T
unbind-key -T copy-mode g
unbind-key -T copy-mode n
unbind-key -T copy-mode N
unbind-key -T copy-mode \;
unbind-key -T copy-mode ,
unbind-key -T copy-mode C-r
unbind-key -T copy-mode C-s
unbind-key -T copy-mode M-x
unbind-key -T copy-mode M-1
unbind-key -T copy-mode M-2
unbind-key -T copy-mode M-3
unbind-key -T copy-mode M-4
unbind-key -T copy-mode M-5
unbind-key -T copy-mode M-6
unbind-key -T copy-mode M-7
unbind-key -T copy-mode M-8
unbind-key -T copy-mode M-9
unbind-key -T copy-mode-vi f
unbind-key -T copy-mode-vi t
unbind-key -T copy-mode-vi F
unbind-key -T copy-mode-vi T
unbind-key -T copy-mode-vi g
unbind-key -T copy-mode-vi n
unbind-key -T copy-mode-vi N
unbind-key -T copy-mode-vi \;
unbind-key -T copy-mode-vi ,
unbind-key -T copy-mode-vi /
unbind-key -T copy-mode-vi ?
unbind-key -T copy-mode-vi M-x
unbind-key -T copy-mode-vi 1
unbind-key -T copy-mode-vi 2
unbind-key -T copy-mode-vi 3
unbind-key -T copy-mode-vi 4
unbind-key -T copy-mode-vi 5
unbind-key -T copy-mode-vi 6
unbind-key -T copy-mode-vi 7
unbind-key -T copy-mode-vi 8
unbind-key -T copy-mode-vi 9
unbind-key -T copy-mode-vi \#
unbind-key -T copy-mode-vi *
unbind-key -T copy-mode-vi :
