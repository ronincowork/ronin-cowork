# tmux config used ONLY to start the long-lived server (see tmux-server.service).
# It is not a replacement for your ~/.tmux.conf — it loads it, then adds the one
# setting the server unit depends on.

source-file -q ~/.tmux.conf

# Keep the server alive with zero sessions. Without this, tmux exits as soon as the
# last session ends — and the NEXT session is then started by whoever asks for one
# first (usually tmux-ronin), which puts the new server back inside that process's
# systemd cgroup, where `systemctl --user restart tmux-ronin` kills it. An always-on
# empty server is what keeps session ownership out of the app's hands.
set-option -s exit-empty off
